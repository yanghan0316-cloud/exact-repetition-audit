name: Verify reproducibility artifacts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Verify released file hashes
        run: python code/verify_manifest.py
      - name: Install numeric dependencies
        run: python -m pip install -r requirements.txt
      - name: Run synthetic contracts
        run: python -m unittest discover -s tests -v
      - name: Recompute primary results
        run: python code/verify_public_tables.py
      - name: Verify decoder and baseline results
        run: python code/verify_extended_results.py
      - name: Verify n-gram artifact hashes
        run: python code/verify_ngram_manifest.py
      - name: Recompute n-gram results and intervals
        run: python code/verify_ngram_results.py
      - name: Run n-gram analysis contracts
        run: python -B -m unittest discover -s code/tests -p test_analyze_ngram_postprimary_v1.py -v

  ngram-decoder:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ngram-decoder.txt
      - name: Install CPU tensor dependency
        run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install n-gram decoder test dependencies
        run: python -m pip install -r requirements-ngram-decoder.txt
      - name: Run n-gram decoder contracts
        run: python -B code/tests/test_whisper_ngram_postprimary_v1.py
