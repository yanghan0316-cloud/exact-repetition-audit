name: Verify reproducibility artifacts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Verify released file hashes
        run: python code/verify_manifest.py
      - name: Install numeric dependencies
        run: python -m pip install -r requirements.txt
      - name: Run synthetic contracts
        run: python -m unittest discover -s tests -v
      - name: Recompute primary results
        run: python code/verify_public_tables.py
      - name: Verify decoder and baseline results
        run: python code/verify_extended_results.py
